name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require master
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "::error::Releases only run on master, not on $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --all-groups --locked
      - name: Read version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Reject dev versions and existing tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *dev*) echo "::error::$VERSION is a dev version"; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
      - name: Verify version against latest tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run bump verify-version --release "$VERSION"
      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run git-changelog --bump "$VERSION" --output "$RUNNER_TEMP/CHANGELOG.md"
          uv run git-changelog --input "$RUNNER_TEMP/CHANGELOG.md" --release-notes > "$RUNNER_TEMP/notes.md"
          if ! head -n 1 "$RUNNER_TEMP/notes.md" | grep -qF "## [$VERSION]"; then
            echo "::error::Release notes do not start with ## [$VERSION], are there commits since the last tag?"
            exit 1
          fi
      - name: Create release and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
