id: tonnes-tc-01
description: Der Brutto-Wert wird als Tonnen Kohlenstoff (tC) statt tCO₂e angegeben.
text: |
  The project is an afforestation and reforestation activity on degraded former pasture in Costa Rica. The project area covers 100.0 ha, as delineated by the polygon provided in Annex A. The activity follows methodology VM0047 (Afforestation, Reforestation and Revegetation) under the Verra VCS programme.

  Aboveground biomass was estimated from three permanent sample plots of 400 m² each, using the allometric equation of Chave et al. (2014). Plot values were scaled to the project area on an area weighted basis.

  The gross removals of the project amount to 2,281 tC over the crediting period. A buffer of 20 % is withheld in the buffer pool to cover the risk of reversal. After the buffer deduction, the net removals available for issuance amount to 6,691 tCO2e.

  Monitoring follows the plan in Section 9 and will be repeated every five years.
