id: area-02
description: Die Fläche wird mit 90 ha statt 100 ha angegeben.
text: |
  Key facts of the project, as stated in Section 4:

  - The project area covers 90 ha, as delineated by the polygon in Annex A.
  - The activity follows methodology VM0047 (Afforestation, Reforestation and Revegetation) under the Verra VCS programme.
  - Aboveground biomass was estimated on three sample plots of 400 m² each, using the allometric equation of Chave et al. (2014).
  - The gross removals of the project amount to 8,364 tCO2e over the crediting period.
  - A buffer of 20 % of the gross removals is withheld to cover the risk of reversal.
  - After the buffer deduction, the net removals available for issuance amount to 6,691 tCO2e.

  The project is an afforestation and reforestation activity on degraded former pasture in Costa Rica, and monitoring will be repeated every five years.
