id: tonnes-swap-01
description: Das Netto wird mit dem Bruttowert (8.364 tCO₂e) angegeben, Brutto und Netto sind vertauscht.
text: |
  - The project is an afforestation and reforestation activity on former pasture in Costa Rica, first planted in 2018.
  - The project area covers 100 ha, as delineated by the polygon in Annex A.
  - The activity follows methodology VM0047 (Afforestation, Reforestation and Revegetation) under the Verra VCS programme.
  - Biomass was measured on 30 trees across three sample plots of 400 m² each.
  - The gross removals of the project amount to 8,364 tCO2e over the crediting period.
  - A buffer of 20 % is withheld in the buffer pool to cover the risk of reversal.
  - After the buffer deduction, the net removals available for issuance amount to 8,364 tCO2e.

  Monitoring is described in Section 9.
expected:
  - field: tco2e_net
    severity: critical
    diagnosis: gross_net_swapped
