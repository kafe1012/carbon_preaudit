[project]
name = "carbon-preaudit"
version = "0.1.0"
description = "Pre-audit check for nature-based carbon project documents"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyproj>=3.8.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.uv.workspace]
members = ["tools"]

[tool.uv.sources]
local-tools = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "git-changelog>=2.5.0",
    "httpx2>=2.16.0",
    "local-tools",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "tools", "evals"]
strict = ["src", "tools", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.git-changelog]
convention = "conventional"
in-place = false
provider = "github"
parse-refs = false
parse-trailers = false
repository = "."
sections = "feat,fix,revert,ref,perf,build,chore,ci,deps,docs,style,test"
template = "keepachangelog"
