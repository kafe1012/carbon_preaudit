[project]
name = "carbon-preaudit"
version = "0.1.0"
description = "Pre-audit check for nature-based carbon project documents"
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyproj>=3.8.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
