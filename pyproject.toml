[project]
name = "nbs-carbon"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
nbs-carbon = "nbs_carbon:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
